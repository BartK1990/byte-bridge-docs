<svg xmlns="http://www.w3.org/2000/svg" id="still" viewBox="40 20 520 556" width="480" height="513">
<style>
/* Protocol Bridge logo, dark theme: the bridge draws in, then values cross it and a command comes back. */
.pb-letters { fill: #f3f4f6; }
.pb-bridge { stroke: #f2a33a; fill: #f2a33a; }
.pb-bridge .arc, .pb-bridge .deck { fill: none; stroke-dasharray: 1; stroke-dashoffset: 1; animation: pb-draw 1.1s cubic-bezier(.6, 0, .2, 1) forwards; }
.pb-bridge .deck { animation-delay: .35s; }
.pb-bridge .post, .pb-bridge .tip { fill: #f2a33a; opacity: 0; animation: pb-fade .4s ease-out 1s forwards; }
.pb-bridge .post { fill: none; }
/* Same story as the tutorial's title card: values flow over the bridge, a command travels back on the same deck,
   and the sending side lights up green when it arrives. */
.pb-flow circle { opacity: 0; transform-box: view-box; }
.pb-flow .v { fill: #fde68a; filter: drop-shadow(0 0 5px #f2a33a); animation: pb-value 1.5s linear infinite; }
.pb-flow .v:nth-child(1) { animation-delay: 1.4s; }
.pb-flow .v:nth-child(2) { animation-delay: 1.9s; }
.pb-flow .v:nth-child(3) { animation-delay: 2.4s; }
.pb-flow .cmd { fill: #4ade80; filter: drop-shadow(0 0 6px #4ade80); animation: pb-cmd 4.5s linear 3s infinite; }
.pb-bridge .ack { fill: #4ade80; filter: drop-shadow(0 0 10px #4ade80); opacity: 0; animation: pb-ack 4.5s ease-out 3s infinite; }
@keyframes pb-value { 0% { transform: translateX(0); opacity: 0; } 15%, 85% { opacity: 1; } 100% { transform: translateX(330px); opacity: 0; } }
@keyframes pb-cmd { 0% { transform: translateX(0); opacity: 1; } 16% { transform: translateX(-330px); opacity: 1; } 16.01%, 100% { opacity: 0; } }
@keyframes pb-ack { 0%, 15% { opacity: 0; } 18% { opacity: 1; } 30%, 100% { opacity: 0; } }
@keyframes pb-draw { to { stroke-dashoffset: 0; } }
@keyframes pb-fade { to { opacity: 1; } }
/* The finished logo, without motion: with reduced motion, or when loaded as logo-*.svg#still. */
@media (prefers-reduced-motion: reduce) {
    .pb-bridge .arc, .pb-bridge .deck, .pb-bridge .post, .pb-bridge .tip { animation: none; stroke-dashoffset: 0; opacity: 1; }
    .pb-flow, .pb-bridge .ack { display: none; }
}
:target .pb-bridge .arc, :target .pb-bridge .deck, :target .pb-bridge .post, :target .pb-bridge .tip { animation: none; stroke-dashoffset: 0; opacity: 1; }
:target .pb-flow, :target .pb-bridge .ack { display: none; }
</style>
<title>Protocol Bridge</title>
<defs>
    <mask id="pb-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="600">
        <rect width="600" height="600" fill="#fff"/>
        <path d="M135 289.2A229.5 229.5 0 0 1 465 289.2A229.5 229.5 0 0 1 135 289.2Z" fill="#000" stroke="#000" stroke-width="53.8" stroke-linejoin="round" stroke-miterlimit="8"/>
        <path d="M136 276.7 111 289.2 136 301.7ZM464 276.7 489 289.2 464 301.7Z" stroke="#000" stroke-width="35" stroke-linejoin="round"/>
    </mask>
</defs>
<g class="pb-letters" fill-rule="evenodd" mask="url(#pb-cut)">
    <path d="M335 30H405A145.8 145.8 0 0 1 405 321.6H335ZM345 94.8H405A81 81 0 0 1 405 256.8H345Z" transform="matrix(-1 0 0 1 600 0)"/>
    <path d="M265.8 30H413.4A129.6 129.6 0 0 1 413.4 289.2H414.6A140.4 140.4 0 0 1 414.6 570H265.8A10.8 10.8 0 0 1 255 559.2V40.8A10.8 10.8 0 0 1 265.8 30ZM345 94.8H413.4A59.4 81 0 0 1 413.4 256.8H345ZM345 321.6H414.6A70.2 91.8 0 0 1 414.6 505.2H345Z"/>
</g>
<g class="pb-bridge" fill="none" stroke-linejoin="round">
    <path class="arc" d="M135 289.2A229.5 229.5 0 0 1 465 289.2A229.5 229.5 0 0 1 135 289.2Z" pathLength="1" stroke-width="18.8" stroke-miterlimit="8"/>
    <path class="deck" d="M135 289.2H465" pathLength="1" stroke-width="27.5"/>
    <path class="post" d="M217.5 239.5V338.9M300 224.2V354.2M382.5 239.5V338.9" stroke-width="13.8" stroke-linecap="round"/>
    <path class="tip" d="M136 276.7 111 289.2 136 301.7ZM464 276.7 489 289.2 464 301.7Z" stroke="none"/>
    <path class="ack" d="M136 276.7 111 289.2 136 301.7Z" stroke="none"/>
</g>
<g class="pb-flow">
    <circle class="v" cx="135" cy="289.2" r="9"/>
    <circle class="v" cx="135" cy="289.2" r="9"/>
    <circle class="v" cx="135" cy="289.2" r="9"/>
    <circle class="cmd" cx="465" cy="289.2" r="11"/>
</g>
</svg>
